<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your Cart | NovaMarket</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body data-cart-screen>
    <header class="site-header">
        <div class="container">
            <div class="site-header__main">
                <a class="site-nav__brand-link" href="/index.html">
                    <span class="site-nav__eyebrow">Everyday style. Smart prices.</span>
                    <span class="site-nav__brand">NovaMarket</span>
                </a>

                <form class="header-search" action="/index.html" method="get" role="search">
                    <label class="visually-hidden" for="header-search-input">Search the product catalog</label>
                    <input
                        id="header-search-input"
                        class="header-search__input"
                        type="search"
                        name="search"
                        placeholder="Search products, brands, or categories"
                    >
                    <button class="btn btn-brand header-search__button" type="submit">Search</button>
                </form>

                <div class="site-header__actions">
                    <a class="header-cart-link" href="/cart.html">
                        <span>Cart</span>
                        <strong data-cart-count>0</strong>
                    </a>
                    <button class="btn btn-brand-outline" type="button" data-bs-toggle="offcanvas" data-bs-target="#cartDrawer" aria-controls="cartDrawer">
                        Quick cart
                    </button>
                </div>
            </div>

        </div>
    </header>

    <main>
        <section class="hero-section hero-section--compact">
            <div class="container">
                <div class="row g-4 align-items-end">
                    <div class="col-lg-8">
                        <span class="hero-section__eyebrow">Your bag</span>
                        <h1 class="hero-section__title">Review your selections before checkout.</h1>
                        <p class="hero-section__copy">
                            Update quantities, remove items, and keep shopping whenever you need to add more.
                        </p>
                    </div>
                    <div class="col-lg-4">
                        <div class="hero-stat-card">
                            <div>
                                <span class="hero-stat-card__label">Items in cart</span>
                                <strong data-cart-items>0</strong>
                            </div>
                            <div>
                                <span class="hero-stat-card__label">Subtotal</span>
                                <strong data-cart-subtotal>$0.00</strong>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="catalog-section">
            <div class="container">
                <div data-cart-page></div>
            </div>
        </section>
    </main>

    <div class="offcanvas offcanvas-end cart-drawer" tabindex="-1" id="cartDrawer" aria-labelledby="cartDrawerLabel">
        <div class="offcanvas-header">
            <div>
                <span class="hero-section__eyebrow">Cart preview</span>
                <h2 class="offcanvas-title" id="cartDrawerLabel">Your cart</h2>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body" data-cart-drawer></div>
    </div>

    <footer class="site-footer">
        <div class="container">
            <p class="mb-0">Copyright &copy; 2026 NovaMarket. All rights reserved.</p>
        </div>
    </footer>

    <div class="status-toast" data-status-toast role="status" aria-live="polite"></div>
    <div class="visually-hidden" id="cart-live-region" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="/assets/js/store.js"></script>
    <script src="/assets/js/cart.js"></script>
</body>
</html>
